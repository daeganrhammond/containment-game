name: Build and publish Containment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Choose Pages base path
        id: pages-path
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository_name" == *.github.io ]]; then
            echo "base_url=" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=/$repository_name" >> "$GITHUB_OUTPUT"
          fi

      - name: Export web build
        run: npm run export:web
        env:
          GITHUB_PAGES_BASE_URL: ${{ steps.pages-path.outputs.base_url }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publish Pages site
        id: deployment
        uses: actions/deploy-pages@v4

